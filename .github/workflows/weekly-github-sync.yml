name: Weekly GitHub Star Sync

on:
  schedule:
    # Every Monday at 02:00 UTC (11:00 KST).
    - cron: "0 2 * * 1"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger protected sync endpoint
        env:
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$BACKEND_URL"
          test -n "$ADMIN_API_KEY"
          curl --fail-with-body --silent --show-error --connect-timeout 20 --max-time 600 \
            -X POST "$BACKEND_URL/api/data/sync/github" \
            -H "X-Admin-Key: $ADMIN_API_KEY"
